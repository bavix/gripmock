version: 2

project_name: gripmock

before:
  hooks:
    - go mod tidy

# Proxy build: shared packages then compile from module@version paths, which is
# what an externally built plugin sees too.
gomod:
  proxy: true

builds:
  # cgo everywhere plugins are possible (windows has no Go plugin support).
  - id: gripmock
    main: .
    binary: gripmock
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED={{ if eq .Os "windows" }}0{{ else }}1{{ end }}
      - >-
        {{- if eq .Os "linux" }}CC=zig cc -target {{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-linux-gnu.2.17{{ end }}
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/bavix/gripmock/v3/internal/infra/build.Version={{.Version}} -X github.com/bavix/gripmock/v3/internal/infra/build.Commit={{.ShortCommit}} -X github.com/bavix/gripmock/v3/internal/infra/build.Date={{.CommitDate}}

  # No cgo: no plugin support, statically linked, runs on musl too.
  - id: gripmock-slim
    main: .
    binary: gripmock
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/bavix/gripmock/v3/internal/infra/build.Version={{.Version}} -X github.com/bavix/gripmock/v3/internal/infra/build.Commit={{.ShortCommit}} -X github.com/bavix/gripmock/v3/internal/infra/build.Date={{.CommitDate}}

archives:
  - id: default
    ids:
      - gripmock
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: slim
    ids:
      - gripmock-slim
    name_template: "{{ .ProjectName }}-slim_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: bavix
    name: gripmock
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - name: gripmock
    repository:
      owner: gripmock
      name: homebrew-tap
      branch: master
    directory: Formula
    ids:
      - default
    homepage: https://bavix.github.io/gripmock/
    description: "A mock server for gRPC services using .proto files or compiled .pb descriptors"
    license: "MIT"
    url_template: "https://github.com/bavix/gripmock/releases/download/v{{ .Version }}/gripmock_{{ .Version }}_{{ .Os }}_{{ .Arch }}.tar.gz"
    commit_author:
      name: Github bot
      email: bot@babichev.net
      signing:
        enabled: true
        key: "{{ .Env.GPG_FINGERPRINT }}"
        program: gpg
        format: openpgp
    commit_msg_template: "Update GripMock to {{ .Version }}"

    # Deprecated 2026-02-18. Distribution channels get a full year of support,
    # so this formula block is removed no earlier than 2027-02-18.
    custom_block: |
      deprecate! date: "2026-02-18", because: "moved to cask. Please run `brew install --cask gripmock`"

    caveats: |
      The 'gripmock' formula is deprecated and will be removed in future versions.
      Please migrate to the cask version:
        brew uninstall gripmock
        brew install --cask gripmock

      Go plugins (--plugins) are supported on macOS and Linux. Build them with
      the same Go version and `go build -trimpath -buildmode=plugin`.

    test: |
      assert_match "v#{version}", shell_output("#{bin}/gripmock --version")

homebrew_casks:
  - name: gripmock
    repository:
      owner: gripmock
      name: homebrew-tap
      branch: master
    # Casks should live in the Casks directory (default). Keep explicit for clarity.
    directory: Casks
    ids:
      - default
    homepage: https://bavix.github.io/gripmock/
    description: "A mock server for gRPC services using .proto files or compiled .pb descriptors"
    license: "MIT"
    url:
      verified: github.com/bavix/gripmock
      template: "https://github.com/bavix/gripmock/releases/download/v{{ .Version }}/gripmock_{{ .Version }}_{{ .Os }}_{{ .Arch }}.tar.gz"
    commit_author:
      name: Github bot
      email: bot@babichev.net
      signing:
        enabled: true
        key: "{{ .Env.GPG_FINGERPRINT }}"
        program: gpg
        format: openpgp
    commit_msg_template: "Update GripMock to {{ .Version }}"
    conflicts:
      - cask: gripmock-slim
    caveats: |
      Built with cgo, so Go plugins (--plugins) are supported.
      For a plugin-free build run: brew install --cask gripmock-slim

    # Optional: remove quarantine on macOS if the binary isn't signed/notarized
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gripmock"]
          end

  - name: gripmock-slim
    repository:
      owner: gripmock
      name: homebrew-tap
      branch: master
    directory: Casks
    ids:
      - slim
    homepage: https://bavix.github.io/gripmock/
    description: "A mock server for gRPC services using .proto files or compiled .pb descriptors (no plugin support)"
    license: "MIT"
    url:
      verified: github.com/bavix/gripmock
      template: "https://github.com/bavix/gripmock/releases/download/v{{ .Version }}/gripmock-slim_{{ .Version }}_{{ .Os }}_{{ .Arch }}.tar.gz"
    commit_author:
      name: Github bot
      email: bot@babichev.net
      signing:
        enabled: true
        key: "{{ .Env.GPG_FINGERPRINT }}"
        program: gpg
        format: openpgp
    commit_msg_template: "Update GripMock to {{ .Version }}"
    conflicts:
      - cask: gripmock
    caveats: |
      Built without cgo: Go plugins (--plugins) are not supported.
      For plugin support run: brew install --cask gripmock

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gripmock"]
          end
