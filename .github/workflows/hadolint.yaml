name: Hadolint
on:
  pull_request:

jobs:
  hadolint:
    name: Lint dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Run hadolint (builder)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.builder

      - name: Run hadolint (Debian runtime)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.debian

      - name: Run hadolint (Debian builder)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.builder.debian

      - name: Run hadolint (nonroot wrapper)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.nonroot
