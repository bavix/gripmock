name: builder

on:
  push:
    branches:
      - "master"
      - "debug"
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        compression: [zstd, gzip]
        distro: [alpine, debian]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - distro: alpine
            builder_file: Dockerfile.builder
            runtime_file: Dockerfile
          - distro: debian
            builder_file: Dockerfile.builder.debian
            runtime_file: Dockerfile.debian
          - compression: zstd
            compression_level: 19
            force_compression: false
          - compression: gzip
            compression_level: 6
            force_compression: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image set
        id: images
        uses: ./.github/actions/build-image-set
        with:
          distro: ${{ matrix.distro }}
          builder-file: ${{ matrix.builder_file }}
          runtime-file: ${{ matrix.runtime_file }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          compression: ${{ matrix.compression }}
          compression-level: ${{ matrix.compression_level }}
          force-compression: ${{ matrix.force_compression }}
          labels: ${{ steps.meta.outputs.labels }}
          version: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          date: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/{builder,runtime,slim}
          builder='${{ steps.images.outputs.builder-digest }}'
          runtime='${{ steps.images.outputs.runtime-digest }}'
          slim='${{ steps.images.outputs.slim-digest }}'
          touch "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/builder/${builder#sha256:}"
          touch "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/runtime/${runtime#sha256:}"
          touch "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/slim/${slim#sha256:}"

      - name: Export nonroot digests
        env:
          NONROOT_DIGEST: ${{ steps.images.outputs.nonroot-digest }}
          SLIM_NONROOT_DIGEST: ${{ steps.images.outputs.slim-nonroot-digest }}
        run: |
          mkdir -p "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/nonroot" "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/slim-nonroot"
          touch "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/nonroot/${NONROOT_DIGEST#sha256:}"
          touch "/tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/slim-nonroot/${SLIM_NONROOT_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.compression }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [alpine, debian]
        compression: [zstd, gzip]
        # Gzip variants support runtimes that cannot pull zstd layers; see https://github.com/bavix/gripmock/discussions/1020 and https://github.com/bavix/gripmock/issues/1021.
        # Only the default Alpine zstd runtime owns `latest`; metadata-action does not append suffixes to latest by default.
        include:
          - distro: alpine
            compression: zstd
            builder_suffix: -builder
            runtime_suffix: ""
            slim_suffix: -slim
            nonroot_suffix: -nonroot
            slim_nonroot_suffix: -slim-nonroot
            latest: auto
          - distro: alpine
            compression: gzip
            builder_suffix: -builder-legacy
            runtime_suffix: -legacy
            slim_suffix: -slim-legacy
            nonroot_suffix: -nonroot-legacy
            slim_nonroot_suffix: -slim-nonroot-legacy
            latest: "false"
          - distro: debian
            compression: zstd
            builder_suffix: -debian-builder
            runtime_suffix: -debian
            slim_suffix: -debian-slim
            nonroot_suffix: -debian-nonroot
            slim_nonroot_suffix: -debian-slim-nonroot
            latest: "false"
          - distro: debian
            compression: gzip
            builder_suffix: -debian-builder-legacy
            runtime_suffix: -debian-legacy
            slim_suffix: -debian-slim-legacy
            nonroot_suffix: -debian-nonroot-legacy
            slim_nonroot_suffix: -debian-slim-nonroot-legacy
            latest: "false"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Dockerhub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish builder image
        uses: ./.github/actions/publish-image-manifest
        with:
          digest-directory: /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/builder
          tag-suffix: ${{ matrix.builder_suffix }}
          description: gRPC Mock Server Builder

      - name: Publish runtime image
        uses: ./.github/actions/publish-image-manifest
        with:
          digest-directory: /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/runtime
          tag-suffix: ${{ matrix.runtime_suffix }}
          latest: ${{ matrix.latest }}
          description: gRPC Mock Server

      - name: Publish slim image
        uses: ./.github/actions/publish-image-manifest
        with:
          digest-directory: /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/slim
          tag-suffix: ${{ matrix.slim_suffix }}
          description: gRPC Mock Server (slim, no plugin support)

      - name: Publish nonroot runtime image
        uses: ./.github/actions/publish-image-manifest
        with:
          digest-directory: /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/nonroot
          tag-suffix: ${{ matrix.nonroot_suffix }}
          description: gRPC Mock Server (nonroot)

      - name: Publish nonroot slim image
        uses: ./.github/actions/publish-image-manifest
        with:
          digest-directory: /tmp/digests/${{ matrix.compression }}/${{ matrix.distro }}/slim-nonroot
          tag-suffix: ${{ matrix.slim_nonroot_suffix }}
          description: gRPC Mock Server (slim, nonroot, no plugin support)
