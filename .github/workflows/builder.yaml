name: builder

on:
  push:
    branches:
      - "master"
      - "debug"
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder image
        id: build_builder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ github.ref_name }}
            commit=${{ github.sha }}
            date=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          outputs: type=image,name=ghcr.io/bavix/gripmock,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Build runtime image
        id: build_runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ github.ref_name }}
            commit=${{ github.sha }}
            date=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          outputs: type=image,name=ghcr.io/bavix/gripmock,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/builder /tmp/digests/runtime
          builder='${{ steps.build_builder.outputs.digest }}'
          runtime='${{ steps.build_runtime.outputs.digest }}'
          touch "/tmp/digests/builder/${builder#sha256:}"
          touch "/tmp/digests/runtime/${runtime#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock
            ghcr.io/bavix/gripmock
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Docker meta (builder)
        id: meta_builder
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock
            ghcr.io/bavix/gripmock
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-builder
            type=semver,pattern={{version}}-builder
            type=semver,pattern={{major}}.{{minor}}-builder
            type=semver,pattern={{major}}-builder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Dockerhub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push builder manifest list
        working-directory: /tmp/digests/builder
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=gRPC Mock Server Builder" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta_builder.outputs.json }}') \
            $(printf "ghcr.io/bavix/gripmock@sha256:%s " *)

      - name: Push runtime manifest list
        working-directory: /tmp/digests/runtime
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=gRPC Mock Server" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "ghcr.io/bavix/gripmock@sha256:%s " *)
