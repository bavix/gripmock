name: builder

on:
  push:
    branches:
      - "master"
      - "debug"
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        compression: [zstd, gzip]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder image
        id: build_builder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ github.ref_name }}
            commit=${{ github.sha }}
            date=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          outputs: type=image,name=ghcr.io/bavix/gripmock,push-by-digest=true,name-canonical=true,push=true,compression=${{ matrix.compression }},compression-level=${{ matrix.compression == 'zstd' && '19' || '6' }},force-compression=${{ matrix.compression == 'gzip' }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}

      - name: Build runtime image
        id: build_runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ github.ref_name }}
            commit=${{ github.sha }}
            date=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILDER_IMAGE=ghcr.io/bavix/gripmock@${{ steps.build_builder.outputs.digest }}
          outputs: type=image,name=ghcr.io/bavix/gripmock,push-by-digest=true,name-canonical=true,push=true,compression=${{ matrix.compression }},compression-level=${{ matrix.compression == 'zstd' && '19' || '6' }},force-compression=${{ matrix.compression == 'gzip' }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}

      - name: Build slim runtime image
        id: build_slim
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ github.ref_name }}
            commit=${{ github.sha }}
            date=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILDER_IMAGE=ghcr.io/bavix/gripmock@${{ steps.build_builder.outputs.digest }}
            cgo=0
          outputs: type=image,name=ghcr.io/bavix/gripmock,push-by-digest=true,name-canonical=true,push=true,compression=${{ matrix.compression }},compression-level=${{ matrix.compression == 'zstd' && '19' || '6' }},force-compression=${{ matrix.compression == 'gzip' }}
          cache-from: type=gha,scope=slim-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.arch }}${{ matrix.compression == 'gzip' && '-legacy' || '' }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/${{ matrix.compression }}/{builder,runtime,slim}
          builder='${{ steps.build_builder.outputs.digest }}'
          runtime='${{ steps.build_runtime.outputs.digest }}'
          slim='${{ steps.build_slim.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.compression }}/builder/${builder#sha256:}"
          touch "/tmp/digests/${{ matrix.compression }}/runtime/${runtime#sha256:}"
          touch "/tmp/digests/${{ matrix.compression }}/slim/${slim#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.compression }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compression: zstd
            suffix: ""
          - compression: gzip
            # Gzip variants for runtimes that cannot pull zstd layers; see https://github.com/bavix/gripmock/discussions/1020 and https://github.com/bavix/gripmock/issues/1021.
            suffix: -legacy
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock
            ghcr.io/bavix/gripmock
          flavor: |
            latest=${{ matrix.compression == 'zstd' && 'auto' || 'false' }}
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Docker meta (builder)
        id: meta_builder
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock
            ghcr.io/bavix/gripmock
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-builder${{ matrix.suffix }}
            type=semver,pattern={{version}}-builder${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}-builder${{ matrix.suffix }}
            type=semver,pattern={{major}}-builder${{ matrix.suffix }}

      - name: Docker meta (slim)
        id: meta_slim
        uses: docker/metadata-action@v6
        with:
          images: |
            bavix/gripmock
            ghcr.io/bavix/gripmock
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-slim${{ matrix.suffix }}
            type=semver,pattern={{version}}-slim${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}-slim${{ matrix.suffix }}
            type=semver,pattern={{major}}-slim${{ matrix.suffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Dockerhub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push builder manifest list
        working-directory: /tmp/digests/${{ matrix.compression }}/builder
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=gRPC Mock Server Builder" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta_builder.outputs.json }}') \
            $(printf "ghcr.io/bavix/gripmock@sha256:%s " *)

      - name: Push runtime manifest list
        working-directory: /tmp/digests/${{ matrix.compression }}/runtime
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=gRPC Mock Server" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "ghcr.io/bavix/gripmock@sha256:%s " *)

      - name: Push slim manifest list
        working-directory: /tmp/digests/${{ matrix.compression }}/slim
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=gRPC Mock Server (slim, no plugin support)" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta_slim.outputs.json }}') \
            $(printf "ghcr.io/bavix/gripmock@sha256:%s " *)
