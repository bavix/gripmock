syntax = "proto3";

package ingest.v1;

option go_package = "github.com/bavix/gripmock/v3/examples/sdk/ingest/v1;ingestv1";

service IngestService {
  rpc UploadBatch(stream UploadBatchRequest) returns (UploadBatchResponse);
}

message UploadBatchRequest {
  string source = 1;
  string level = 2;
  string message = 3;
  repeated string tags = 4;
}

message UploadBatchResponse {
  string batch_id = 1;
  int32 accepted = 2;
  int32 rejected = 3;
}
