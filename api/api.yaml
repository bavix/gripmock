openapi: 3.0.2
servers:
  - url: /api
security:
  - {}
info:
  version: 3.18.4
  title: GripMock API Schema
  description: |
    REST control plane for [GripMock](https://github.com/bavix/gripmock), a gRPC mock server.

    Use it to load stubs, ask which stub a request would match, read call history and assert
    call counts — all while the server keeps running.

    **Base URL.** Every path below is relative to `/api`, served on the HTTP port (`4771` by
    default). The gRPC port (`4770`) and the ConnectRPC/gRPC-web gateway (`4769`) are separate.

    **Sessions.** Send `X-Gripmock-Session: <id>` to scope a request to one session. Stubs
    created within a session are visible only there, and call history is kept apart. Without
    the header the request works against the global scope.

    **Not in this document.** `POST /api/mcp` speaks the Model Context Protocol for agent
    tooling, and `GET /metrics` — outside `/api` — serves Prometheus metrics.
  contact:
    name: Maksim Babichev
    url: https://github.com/bavix/gripmock-openapi
  license:
    name: MIT
    url: https://github.com/bavix/gripmock-openapi/blob/master/LICENSE
tags:
  - name: healthcheck
    description: Liveness and readiness probes.
  - name: dashboard
    description: Aggregate counters and build/runtime information behind the web UI.
  - name: sessions
    description: Session IDs currently known to the server.
  - name: services
    description: Services and methods GripMock can serve, across every descriptor source.
  - name: stubs
    description: >-
      Create, list, search and delete stubs, and inspect why one matched. Send `X-Gripmock-Session: <id>`
      to scope the call to one session; without it the request works against the global scope.
  - name: history
    description: >-
      Calls the server has answered, newest first. Send `X-Gripmock-Session: <id>` to scope the call to
      one session; without it the request works against the global scope.
  - name: verify
    description: >-
      Assert how many times a method was called. Send `X-Gripmock-Session: <id>` to scope the call to
      one session; without it the request works against the global scope.
  - name: descriptors
    description: Load a compiled `FileDescriptorSet` into a running server.
paths:
  # healthcheck
  /health/liveness:
    get:
      tags:
        - healthcheck
      summary: Liveness check
      description: This endpoint indicates that the service is alive and ready to handle requests
      operationId: liveness
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOK'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /health/readiness:
    get:
      tags:
        - healthcheck
      summary: Readiness check
      description: The test indicates readiness to receive traffic
      operationId: readiness
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOK'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

  # dashboard
  /dashboard:
    get:
      tags:
        - dashboard
      summary: Dashboard aggregate payload
      description: Returns combined dashboard counters, runtime metadata, and process state in one 
        response.
      operationId: dashboard
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '500':
          description: Internal Server Error
  /dashboard/overview:
    get:
      tags:
        - dashboard
      summary: Dashboard overview metrics
      description: Returns lightweight aggregate counters for admin UI dashboard.
      operationId: dashboardOverview
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '500':
          description: Internal Server Error
  /dashboard/info:
    get:
      tags:
        - dashboard
      summary: Dashboard runtime and build info
      description: Returns GripMock build metadata and current runtime process information.
      operationId: dashboardInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardInfo'
        '500':
          description: Internal Server Error

  # sessions
  /sessions:
    get:
      tags:
        - sessions
      summary: Session options
      description: Returns distinct non-empty session IDs available in current stubs.
      operationId: sessionsList
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        '500':
          description: Internal Server Error

  # services reflection
  /services:
    get:
      tags:
        - services
      summary: Services
      description: List of registered services
      operationId: servicesList
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '404':
          description: No services found
        '500':
          description: Internal Server Error
  /services/{serviceID}/methods:
    get:
      tags:
        - services
      summary: Service methods
      description: List of registered service methods
      operationId: serviceMethodsList
      parameters:
        - name: serviceID
          in: path
          description: ID of service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Method'
        '400':
          description: Invalid service ID
        '404':
          description: Service not found
        '500':
          description: Internal Server Error
  /services/{serviceID}/methods/{methodID}:
    get:
      tags:
        - services
      summary: Service method details
      description: Returns exact metadata for one method (by short name or full method id).
      operationId: serviceMethodGet
      parameters:
        - name: serviceID
          in: path
          description: Full service name (e.g. helloworld.Greeter)
          required: true
          schema:
            type: string
        - name: methodID
          in: path
          description: Method short name (e.g. SayHello) or full id (e.g. 
            helloworld.Greeter/SayHello)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Method'
        '400':
          description: Invalid service or method id
        '404':
          description: Service or method not found
        '500':
          description: Internal Server Error
  /services/{serviceID}:
    get:
      tags:
        - services
      summary: Service details
      description: Returns exact metadata for one service including all methods and streaming 
        capabilities.
      operationId: serviceGet
      parameters:
        - name: serviceID
          in: path
          description: Full service name (e.g. helloworld.Greeter)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid service ID
        '404':
          description: Service not found
        '500':
          description: Internal Server Error
    delete:
      tags:
        - services
      summary: Remove service
      description: Removes a service added via POST /descriptors. Services from startup (proto path)
        cannot be removed.
      operationId: deleteService
      parameters:
        - name: serviceID
          in: path
          description: Full service name (e.g. helloworld.Greeter)
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Service removed successfully
        '404':
          description: Service not found (not added via REST or already removed)
        '500':
          description: Internal Server Error

  # stubs
  /stubs/used:
    get:
      tags:
        - stubs
      summary: Getting a list of used stubs
      description: The list is needed to quickly find used stubs
      operationId: listUsedStubs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StubList'
        '404':
          description: No used stubs found
        '500':
          description: Internal Server Error
  /stubs/unused:
    get:
      tags:
        - stubs
      summary: Getting a list of unused stubs
      description: The list is needed to quickly find unused stubs
      operationId: listUnusedStubs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StubList'
        '404':
          description: No unused stubs found
        '500':
          description: Internal Server Error
  /stubs:
    get:
      tags:
        - stubs
      summary: Getting a list of stubs
      description: The list of stubs is required to view all added stubs. Use source query param to 
        filter by source.
      operationId: listStubs
      parameters:
        - name: source
          in: query
          description: Filter by source (file, rest, mcp, proxy)
          required: false
          schema:
            type: string
        - name: service
          in: query
          description: Filter by service name (exact match)
          required: false
          schema:
            type: string
        - name: method
          in: query
          description: Filter by method name (exact match)
          required: false
          schema:
            type: string
        - name: session
          in: query
          description: Filter by session ID (empty means global stubs)
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive substring search over service, method and stub ID
          required: false
          schema:
            type: string
        - name: matcher
          in: query
          description: >-
            Filter by matcher kind(s) present on the stub input. Comma-separated
            for OR semantics (e.g. "glob,anyOf"). Valid kinds: equals, contains,
            matches, glob, anyOf.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of returned stubs
          required: false
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Number of stubs to skip before returning results
          required: false
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          description: Sort order for result list
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          headers:
            X-Total-Count:
              description: Total number of stubs matching the filters, before pagination
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StubList'
        '400':
          description: >-
            A query parameter could not be parsed, for example a non-numeric `limit`.
        '404':
          description: No stubs found
        '500':
          description: Internal Server Error
    post:
      tags:
        - stubs
      summary: Add a new stub to the store
      description: Creates a new stub or multiple stubs and adds them to the storage
      operationId: addStub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ListID'
        '400':
          description: >-
            The payload is not valid JSON, or the stub failed validation — for example `input` and `inputs`
            both set, or `output` carrying both the unary side and `stream`. The body holds an `error`
            string naming the field.
        '413':
          description: Payload Too Large
        '500':
          description: Internal Server Error
      requestBody:
        description: Create a new stub in the store
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StubList'
                - $ref: '#/components/schemas/Stub'
    delete:
      tags:
        - stubs
      summary: Remove stubs
      description: >-
        Deletes stubs. With `X-Gripmock-Session` only the stubs of that session are removed,
        so one client cannot wipe another session's fixtures; without the header the whole
        stub storage is cleared.
      operationId: purgeStubs
      responses:
        '204':
          description: Successful operation
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /stubs/batchDelete:
    post:
      tags:
        - stubs
      summary: Deletes a batch of stubs by IDs
      description: Takes IDs as input and deletes them
      operationId: batchStubsDelete
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid IDs provided
        '404':
          description: Some stubs not found
        '413':
          description: Payload Too Large
        '500':
          description: Internal Server Error
      requestBody:
        description: Delete stubs by their IDs
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListID'
  /stubs/validate:
    post:
      tags:
        - stubs
      summary: Validate a stub payload without persisting
      description: Validates one or more stubs and returns them normalized without adding to storage
      operationId: validateStub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StubList'
        '400':
          description: >-
            The payload is not valid JSON, or the stub failed validation — for example `input` and `inputs`
            both set, or `output` carrying both the unary side and `stream`. The body holds an `error`
            string naming the field.
        '413':
          description: Payload Too Large
        '500':
          description: Internal Server Error
      requestBody:
        description: Stub payload to validate
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StubList'
                - $ref: '#/components/schemas/Stub'
  /stubs/{uuid}:
    get:
      tags:
        - stubs
      summary: Get Stub by ID
      description: Searches for Stub by ID
      operationId: findByID
      parameters:
        - name: uuid
          in: path
          description: ID of stub
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stub'
        '400':
          description: Invalid UUID format
        '404':
          description: Stub not found
        '500':
          description: Internal Server Error
    delete:
      tags:
        - stubs
      summary: Deletes stub by ID
      description: The method removes the stub by ID
      operationId: deleteStubByID
      parameters:
        - name: uuid
          in: path
          description: ID of stub
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '204':
          description: successful operation
        '400':
          description: Invalid UUID format
        '404':
          description: Stub not found
        '500':
          description: Internal Server Error
  /stubs/search:
    post:
      tags:
        - stubs
      summary: Stub storage search
      description: Performs a search for a stub by the given conditions
      operationId: searchStubs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search criteria
        '413':
          description: Payload Too Large
        '422':
          description: Validation error
        '500':
          description: Internal Server Error
      requestBody:
        description: Search criteria including service, method, headers and data to match against 
          stubs
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
  /stubs/inspect:
    post:
      tags:
        - stubs
      summary: Inspect stub matching decision path
      description: Returns detailed matching stages/candidates for a query without consuming stub 
        times.
      operationId: inspectStubs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectReport'
        '400':
          description: Invalid inspect criteria
        '413':
          description: Payload Too Large
        '422':
          description: Validation error
        '500':
          description: Internal Server Error
      requestBody:
        description: Inspect criteria including service, method, optional headers/session and input 
          messages
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'

  # history & verify
  /history:
    get:
      tags:
        - history
      summary: Get call history
      description: Returns recorded gRPC calls (when history is enabled)
      operationId: listHistory
      parameters:
        - name: limit
          in: query
          required: false
          description: Return at most N most-recent records
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Skip the N newest records (page backward through older calls)
          schema:
            type: integer
            minimum: 0
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: >-
            Keep only calls to this fully qualified service name.
        - name: method
          in: query
          required: false
          schema:
            type: string
          description: >-
            Keep only calls to this method name.
        - name: error
          in: query
          required: false
          description: When true, return only calls that ended with a gRPC error
          schema:
            type: boolean
      responses:
        '200':
          description: List of recorded calls
          headers:
            X-Total-Count:
              description: Total number of records before pagination
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryList'
        '400':
          description: >-
            A query parameter could not be parsed, for example a non-numeric `limit`.
        '500':
          description: Internal Server Error
    delete:
      tags:
        - history
      summary: Purge call history
      description: >-
        Deletes recorded calls. With `X-Gripmock-Session` only the records of that session are
        removed, so a test can reset its own history without disturbing the calls of a parallel
        session; without the header the whole history is cleared.
      operationId: purgeHistory
      responses:
        '200':
          description: Number of records deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPurged'
        '500':
          description: Internal Server Error
  /verify:
    post:
      tags:
        - verify
      summary: Verify call counts
      description: >-
        Asserts that a method was called a specified number of times. With `X-Gripmock-Session`
        the count covers that session's calls plus global ones — the same scope its stubs match
        in. Without the header every call is counted, including calls made under a session.
      operationId: verifyCalls
      responses:
        '200':
          description: Verification passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOK'
        '400':
          description: Verification failed (wrong call count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyError'
        '413':
          description: Payload Too Large
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'

  # descriptors
  /descriptors:
    get:
      tags:
        - descriptors
      summary: List service IDs from REST-added descriptors
      description: Returns service IDs (e.g. helloworld.Greeter) added via POST /descriptors. Use 
        DELETE /services/{serviceID} to remove.
      operationId: listDescriptors
      responses:
        '200':
          description: List of removable service IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptorServiceIDs'
        '500':
          description: Internal Server Error
    post:
      tags:
        - descriptors
      summary: Upload FileDescriptorSet
      description: Accepts binary Protocol Buffers FileDescriptorSet. Registers descriptors for 
        dynamic service discovery. Returns service IDs for later removal via DELETE 
        /services/{serviceID}.
      operationId: addDescriptors
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Descriptors registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDescriptorsResponse'
        '400':
          description: Invalid or empty FileDescriptorSet
        '413':
          description: Payload Too Large
        '500':
          description: Internal Server Error

components:
  schemas:
    # health
    MessageOK:
      type: object
      required:
        - message
        - time
      properties:
        message:
          type: string
          x-omitzero: false
          description: >-
            Human-readable result of the operation.
        time:
          type: string
          format: date-time
          x-omitzero: false
          description: >-
            Server time when the response was produced (RFC 3339).
      description: >-
        Generic acknowledgement.
    AddDescriptorsResponse:
      type: object
      required:
        - message
        - time
        - serviceIDs
      properties:
        message:
          type: string
          x-omitzero: false
          description: >-
            Human-readable result of the upload.
        time:
          type: string
          format: date-time
          x-omitzero: false
          description: >-
            Server time when the response was produced (RFC 3339).
        serviceIDs:
          type: array
          items:
            type: string
          description: Service IDs (e.g. helloworld.Greeter) registered. Use DELETE 
            /services/{serviceID} to remove.
      description: >-
        Result of registering an uploaded FileDescriptorSet.
    DescriptorServiceIDs:
      type: object
      required:
        - serviceIDs
      properties:
        serviceIDs:
          type: array
          items:
            type: string
          description: Service IDs added via POST /descriptors
    # services
      description: >-
        Service IDs registered from descriptors uploaded over REST.
    Service:
      type: object
      required:
        - id
        - package
        - name
        - methods
      properties:
        id:
          type: string
          x-omitzero: false
          description: >-
            Fully qualified service name, used as the path segment in `/services/{serviceID}`.
        package:
          type: string
          x-omitzero: false
          description: >-
            Proto package the service is declared in.
        name:
          type: string
          x-omitzero: false
          description: >-
            Service name without the package prefix.
        methods:
          type: array
          items:
            $ref: '#/components/schemas/Method'
          x-omitzero: false
          description: >-
            Methods the service exposes.
      description: >-
        A gRPC service GripMock can serve.
    Method:
      type: object
      required:
        - id
        - name
        - methodType
      properties:
        id:
          type: string
          x-omitzero: false
          description: >-
            Method name, used as the path segment in `/methods/{methodID}`.
        name:
          type: string
          x-omitzero: false
          description: >-
            Method name as declared in the proto file.
        methodType:
          type: string
          description: gRPC method interaction type
          enum:
            - unary
            - client_streaming
            - server_streaming
            - bidi_streaming
          x-omitzero: false
        requestType:
          type: string
          description: Fully-qualified protobuf request message type
        responseType:
          type: string
          description: Fully-qualified protobuf response message type
        requestSchema:
          $ref: '#/components/schemas/ProtoMessageSchema'
        responseSchema:
          $ref: '#/components/schemas/ProtoMessageSchema'
        clientStreaming:
          type: boolean
          description: Indicates client-side streaming method
          x-go-type-skip-optional-pointer: true
        serverStreaming:
          type: boolean
          description: Indicates server-side streaming method
          x-go-type-skip-optional-pointer: true
      description: >-
        A method of a gRPC service.
    ProtoMessageSchema:
      type: object
      required:
        - typeName
        - fields
      properties:
        typeName:
          type: string
          description: Fully-qualified protobuf message type name
        recursiveRef:
          type: boolean
          description: True when schema expansion stopped due to recursive reference
          x-go-type-skip-optional-pointer: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProtoFieldSchema'
          description: >-
            Fields declared on the message.
      description: >-
        Shape of a proto message, as GripMock resolved it from the descriptor.
    ProtoFieldSchema:
      type: object
      required:
        - name
        - jsonName
        - number
        - kind
        - cardinality
      properties:
        name:
          type: string
          description: >-
            Field name as declared in the proto file (snake_case).
        jsonName:
          type: string
          description: >-
            Field name in protojson output (camelCase).
        number:
          type: integer
          minimum: 1
          description: >-
            Field number from the proto definition.
        kind:
          type: string
          description: >-
            Proto kind, for example `string`, `int32`, `message`, `enum`.
        cardinality:
          type: string
          enum:
            - optional
            - required
            - repeated
          description: >-
            Whether the field is optional, required or repeated.
        typeName:
          type: string
          description: Referenced protobuf type for message/enum fields
        oneof:
          type: string
          description: Oneof group name if field belongs to oneof
        enumValues:
          type: array
          items:
            type: string
          description: >-
            Allowed value names when `kind` is `enum`.
        map:
          type: boolean
